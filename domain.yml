version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - start_interview
  - stop_interview
  - provide_exp
  - provide_skills
  - provide_projects
  - provide_salary
  - provide_availability
  - provide_multiple_fields
  - provide_education
  - provide_english
  - provide_work_format
  - provide_tie_breaker
  - provide_follow_up
  - change_answer
  - repeat_question
  - skip_question
  - ask_roles
  - ask_role_details
  - ask_process
  - ask_next_step
  - ask_clarification
  - out_of_scope
  - nlu_fallback

entities:
  - target_role
  - work_format
  - salary_amount
  - availability
  - experience_years
  - skill
  - project_type
  - project_complexity
  - project_role
  - education
  - english_level
  - field_name

slots:
  candidate_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  target_role:
    type: categorical
    values:
      - project_manager
      - data_analyst
      - data_engineer
      - data_scientist
      - mlops_engineer
      - unknown
    mappings:
      - type: custom
  experience_years:
    type: float
    min_value: 0
    max_value: 50
    influence_conversation: false
    mappings:
      - type: custom
  skills:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  project_types:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  project_complexity:
    type: categorical
    values:
      - low
      - medium
      - high
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  project_role:
    type: categorical
    values:
      - manager
      - analyst
      - developer
      - lead
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  salary_expectation_min:
    type: float
    min_value: 0
    max_value: 2000000
    influence_conversation: false
    mappings:
      - type: custom
  salary_expectation_max:
    type: float
    min_value: 0
    max_value: 2000000
    influence_conversation: false
    mappings:
      - type: custom
  availability:
    type: categorical
    values:
      - available_now
      - available_soon
      - available_not_soon
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  education_text:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: interview_form
            requested_slot: education_text
  education_level:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  education_field:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  english_level:
    type: categorical
    values:
      - none
      - a1
      - a2
      - b1
      - b2
      - c1
      - c2
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  work_format:
    type: categorical
    values:
      - office
      - remote
      - hybrid
      - any
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  candidate_summary:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  recruiter_report:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  role_ranking:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  risk_flags:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  decision_status:
    type: categorical
    values:
      - fit
      - borderline
      - reject
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  recommended_role:
    type: categorical
    values:
      - project_manager
      - data_analyst
      - data_engineer
      - data_scientist
      - mlops_engineer
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  tie_breaker_question:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  tie_breaker_answer:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  follow_up_questions:
    type: list
    influence_conversation: true
    mappings:
      - type: custom
  follow_up_answer:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  export_path_json:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  export_path_csv:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:
  interview_form:
    required_slots:
      - candidate_name
      - target_role
      - experience_years
      - skills
      - project_types
      - project_role
      - education_text
      - english_level
      - work_format
      - salary_expectation_min
      - availability

responses:
  utter_greet:
    - text: "Здравствуйте. Здесь можно пройти первичное интервью на роли в ML-команде."
    - text: "Здравствуйте. Можем пройти короткое интервью по открытым ролям в ML-команде."
    - text: "Добрый день. Если хотите откликнуться, я задам несколько вопросов по опыту."
    - text: "Приветствую. Готов начать первичное интервью по вакансии."
    - text: "Здравствуйте. Давайте разберем ваш опыт и поймем, какое направление ближе."
  utter_goodbye:
    - text: "До свидания. Удачи."
    - text: "До свидания. Хорошего дня."
    - text: "Спасибо за разговор. До свидания."
    - text: "Хорошо, завершаем. Всего доброго."
    - text: "Принято, на этом остановимся."
  utter_start_interview:
    - text: "Хорошо, начнем. Сначала представьтесь, затем перейдем к опыту и проектам."
    - text: "Давайте начнем. Сначала уточню, как к вам обращаться, потом обсудим опыт."
    - text: "Окей, стартуем. Начнем с ФИО, дальше пройдемся по роли, опыту и ожиданиям."
    - text: "Хорошо. Для начала зафиксирую ваши данные, затем перейдем к собеседованию."
    - text: "Давайте. Сначала коротко познакомимся, потом обсудим вашу роль и опыт."
  utter_stop_interview:
    - text: "Интервью остановлено. Если захотите продолжить позже, просто напишите, что хотите откликнуться."
    - text: "Хорошо, остановимся. Вернуться к интервью можно позже."
    - text: "Останавливаю интервью. Если решите продолжить, напишите об этом."
    - text: "Принято, на этом пока закончим."
    - text: "Хорошо, прервем собеседование."
  utter_ask_target_role:
    - text: "Окей, теперь по роли: какое направление вам ближе?"
      buttons:
        - title: "Project Manager"
          payload: '/provide_multiple_fields{"target_role":"project_manager"}'
        - title: "Data Analyst"
          payload: '/provide_multiple_fields{"target_role":"data_analyst"}'
        - title: "Data Engineer"
          payload: '/provide_multiple_fields{"target_role":"data_engineer"}'
        - title: "Data Scientist"
          payload: '/provide_multiple_fields{"target_role":"data_scientist"}'
        - title: "MLOps Engineer"
          payload: '/provide_multiple_fields{"target_role":"mlops_engineer"}'
        - title: "Другое"
          payload: '/provide_multiple_fields{"target_role":"unknown"}'
      button_type: vertical
    - text: "На какое направление хотите откликнуться?"
      buttons:
        - title: "Project Manager"
          payload: '/provide_multiple_fields{"target_role":"project_manager"}'
        - title: "Data Analyst"
          payload: '/provide_multiple_fields{"target_role":"data_analyst"}'
        - title: "Data Engineer"
          payload: '/provide_multiple_fields{"target_role":"data_engineer"}'
        - title: "Data Scientist"
          payload: '/provide_multiple_fields{"target_role":"data_scientist"}'
        - title: "MLOps Engineer"
          payload: '/provide_multiple_fields{"target_role":"mlops_engineer"}'
        - title: "Другое"
          payload: '/provide_multiple_fields{"target_role":"unknown"}'
      button_type: vertical
    - text: "Спасибо. На какую позицию вы хотите пройти собеседование?"
      buttons:
        - title: "Project Manager"
          payload: '/provide_multiple_fields{"target_role":"project_manager"}'
        - title: "Data Analyst"
          payload: '/provide_multiple_fields{"target_role":"data_analyst"}'
        - title: "Data Engineer"
          payload: '/provide_multiple_fields{"target_role":"data_engineer"}'
        - title: "Data Scientist"
          payload: '/provide_multiple_fields{"target_role":"data_scientist"}'
        - title: "MLOps Engineer"
          payload: '/provide_multiple_fields{"target_role":"mlops_engineer"}'
        - title: "Другое"
          payload: '/provide_multiple_fields{"target_role":"unknown"}'
      button_type: vertical
    - text: "На какую позицию вы хотите пройти собеседование?"
      buttons:
        - title: "Project Manager"
          payload: '/provide_multiple_fields{"target_role":"project_manager"}'
        - title: "Data Analyst"
          payload: '/provide_multiple_fields{"target_role":"data_analyst"}'
        - title: "Data Engineer"
          payload: '/provide_multiple_fields{"target_role":"data_engineer"}'
        - title: "Data Scientist"
          payload: '/provide_multiple_fields{"target_role":"data_scientist"}'
        - title: "MLOps Engineer"
          payload: '/provide_multiple_fields{"target_role":"mlops_engineer"}'
        - title: "Другое"
          payload: '/provide_multiple_fields{"target_role":"unknown"}'
      button_type: vertical
    - text: "Какая вакансия вам интересна?"
      buttons:
        - title: "Project Manager"
          payload: '/provide_multiple_fields{"target_role":"project_manager"}'
        - title: "Data Analyst"
          payload: '/provide_multiple_fields{"target_role":"data_analyst"}'
        - title: "Data Engineer"
          payload: '/provide_multiple_fields{"target_role":"data_engineer"}'
        - title: "Data Scientist"
          payload: '/provide_multiple_fields{"target_role":"data_scientist"}'
        - title: "MLOps Engineer"
          payload: '/provide_multiple_fields{"target_role":"mlops_engineer"}'
        - title: "Другое"
          payload: '/provide_multiple_fields{"target_role":"unknown"}'
      button_type: vertical
  utter_ask_candidate_name:
    - text: "Как вас зовут? Напишите, пожалуйста, фамилию и имя."
    - text: "Для начала представьтесь, пожалуйста: фамилия и имя."
    - text: "Как к вам обращаться в отклике? Лучше указать фамилию и имя."
    - text: "Сначала зафиксирую ФИО. Напишите, пожалуйста, как вас представить рекрутеру."
    - text: "Представьтесь, пожалуйста, чтобы я корректно передал отклик рекрутеру."
  utter_ask_experience_years:
    - text: "Сколько лет или месяцев релевантной практики можно учитывать? Можно ответить просто числом."
      buttons:
        - title: "3 месяца"
          payload: '/provide_exp{"experience_years":"0.25"}'
        - title: "1 год"
          payload: '/provide_exp{"experience_years":"1"}'
        - title: "3 года"
          payload: '/provide_exp{"experience_years":"3"}'
      button_type: vertical
    - text: "Теперь уточню длительность опыта: сколько лет вы занимались похожими задачами?"
      buttons:
        - title: "3 месяца"
          payload: '/provide_exp{"experience_years":"0.25"}'
        - title: "1 год"
          payload: '/provide_exp{"experience_years":"1"}'
        - title: "3 года"
          payload: '/provide_exp{"experience_years":"3"}'
      button_type: vertical
