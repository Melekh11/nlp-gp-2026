version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - start_interview
  - stop_interview
  - provide_exp
  - provide_skills
  - provide_projects
  - provide_salary
  - provide_availability
  - provide_multiple_fields
  - provide_education
  - provide_english
  - provide_work_format
  - provide_tie_breaker
  - change_answer
  - repeat_question
  - skip_question
  - ask_roles
  - ask_role_details
  - ask_process
  - ask_next_step
  - ask_clarification
  - out_of_scope
  - nlu_fallback

entities:
  - target_role
  - work_format
  - salary_amount
  - availability
  - experience_years
  - skill
  - project_type
  - project_complexity
  - project_role
  - education
  - english_level
  - field_name

slots:
  target_role:
    type: categorical
    values:
      - project_manager
      - data_analyst
      - data_engineer
      - data_scientist
      - mlops_engineer
      - unknown
    mappings:
      - type: from_entity
        entity: target_role
  experience_years:
    type: float
    min_value: 0
    max_value: 50
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: experience_years
  skills:
    type: list
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: skill
  project_types:
    type: list
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: project_type
  project_complexity:
    type: categorical
    values:
      - low
      - medium
      - high
      - unknown
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: project_complexity
  project_role:
    type: categorical
    values:
      - manager
      - analyst
      - developer
      - lead
      - unknown
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: project_role
  salary_expectation_min:
    type: float
    min_value: 0
    max_value: 2000000
    influence_conversation: false
    mappings:
      - type: custom
  salary_expectation_max:
    type: float
    min_value: 0
    max_value: 2000000
    influence_conversation: false
    mappings:
      - type: custom
  availability:
    type: categorical
    values:
      - available_now
      - available_soon
      - available_not_soon
      - unknown
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: availability
  education_text:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: interview_form
            requested_slot: education_text
  education_level:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  education_field:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  english_level:
    type: categorical
    values:
      - none
      - a1
      - a2
      - b1
      - b2
      - c1
      - c2
      - unknown
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: english_level
  work_format:
    type: categorical
    values:
      - office
      - remote
      - hybrid
      - any
      - unknown
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: work_format
  candidate_summary:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  recruiter_report:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  role_ranking:
    type: any
    influence_conversation: false
    mappings:
      - type: custom
  risk_flags:
    type: list
    influence_conversation: false
    mappings:
      - type: custom
  decision_status:
    type: categorical
    values:
      - fit
      - borderline
      - reject
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  recommended_role:
    type: categorical
    values:
      - project_manager
      - data_analyst
      - data_engineer
      - data_scientist
      - mlops_engineer
      - unknown
    influence_conversation: false
    mappings:
      - type: custom
  tie_breaker_question:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  tie_breaker_answer:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  export_path_json:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  export_path_csv:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

forms:
  interview_form:
    required_slots:
      - target_role
      - experience_years
      - skills
      - project_types
      - project_role
      - education_text
      - english_level
      - work_format
      - salary_expectation_min
      - availability

responses:
  utter_greet:
    - text: "Здравствуйте. Я помогу пройти первичное интервью на позиции в ML-команде."
  utter_goodbye:
    - text: "До свидания. Удачи."
  utter_start_interview:
    - text: "Хорошо, начнем. Я задам несколько вопросов об опыте, навыках и ожиданиях."
  utter_stop_interview:
    - text: "Остановил интервью. Можно начать заново командой: начать интервью."
  utter_ask_target_role:
    - text: "На какую позицию вы хотите пройти собеседование?"
  utter_ask_experience_years:
    - text: "Сколько лет релевантного опыта у вас есть?"
  utter_ask_skills:
    - text: "Перечислите ключевые навыки и инструменты."
  utter_ask_project_types:
    - text: "Расскажите о 1-2 самых релевантных проектах: тип проекта, данные, инструменты, результат."
  utter_ask_project_role:
    - text: "Какую роль вы выполняли в проектах: менеджер, аналитик, разработчик или лид?"
  utter_ask_education_text:
    - text: "Какое у вас образование или профильная подготовка?"
  utter_ask_english_level:
    - text: "Какой у вас уровень английского?"
  utter_ask_work_format:
    - text: "Какой формат работы вам подходит: офис, удаленно, гибрид или любой?"
  utter_ask_salary_expectation_min:
    - text: "Какие зарплатные ожидания? Можно указать диапазон."
  utter_ask_availability:
    - text: "Когда готовы выйти на работу?"
  utter_roles:
    - text: "Сейчас открыты направления: Project Manager, Data Analyst, Data Engineer, Data Scientist и MLOps Engineer."
  utter_process:
    - text: "Можно откликнуться прямо здесь. Я задам несколько вопросов по опыту и ожиданиям, после чего передам информацию рекрутеру."
  utter_clarification:
    - text: "Отвечайте свободным текстом. Если нужно исправить ответ, напишите, что именно поменять."
  utter_out_of_scope:
    - text: "Давайте вернемся к собеседованию по вакансии."
  utter_default:
    - text: "Уточните, пожалуйста. Если хотите откликнуться на вакансию, напишите, на какую позицию вы претендуете."

actions:
  - validate_interview_form
  - action_rank_candidate
  - action_apply_tie_breaker
  - action_change_answer
  - action_repeat_question
  - action_skip_question
  - action_show_next_step
  - action_show_role_details

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
