      buttons:
        - title: "Управление"
          payload: '/provide_projects{"project_role":"manager"}'
        - title: "Аналитика"
          payload: '/provide_projects{"project_role":"analyst"}'
        - title: "Разработка"
          payload: '/provide_projects{"project_role":"developer"}'
        - title: "Лидировал"
          payload: '/provide_projects{"project_role":"lead"}'
        - title: "Другое"
          payload: '/provide_projects{"project_role":"unknown"}'
      button_type: vertical
    - text: "Окей, а ваша часть была ближе к анализу, разработке, управлению или лидерству?"
      buttons:
        - title: "Управление"
          payload: '/provide_projects{"project_role":"manager"}'
        - title: "Аналитика"
          payload: '/provide_projects{"project_role":"analyst"}'
        - title: "Разработка"
          payload: '/provide_projects{"project_role":"developer"}'
        - title: "Лидировал"
          payload: '/provide_projects{"project_role":"lead"}'
        - title: "Другое"
          payload: '/provide_projects{"project_role":"unknown"}'
      button_type: vertical
  utter_ask_education_text:
    - text: "Расскажите про образование или профильную подготовку."
    - text: "Есть ли у вас профильное образование, курсы или сертификаты?"
    - text: "Какая подготовка помогает вам в этой роли?"
    - text: "Окей, теперь про образование: что из учебы, курсов или сертификатов важно учесть?"
    - text: "Перейдем к подготовке. Какое образование или обучение связано с этой ролью?"
  utter_ask_english_level:
