        - title: "3 года"
          payload: '/provide_exp{"experience_years":"3"}'
      button_type: vertical
    - text: "Окей, теперь именно про длительность опыта: сколько лет или месяцев можно считать релевантными?"
      buttons:
        - title: "3 месяца"
          payload: '/provide_exp{"experience_years":"0.25"}'
        - title: "1 год"
          payload: '/provide_exp{"experience_years":"1"}'
        - title: "3 года"
          payload: '/provide_exp{"experience_years":"3"}'
      button_type: vertical
    - text: "Сколько времени вы работали или практиковались с задачами, близкими к выбранной роли?"
      buttons:
        - title: "3 месяца"
          payload: '/provide_exp{"experience_years":"0.25"}'
        - title: "1 год"
          payload: '/provide_exp{"experience_years":"1"}'
        - title: "3 года"
          payload: '/provide_exp{"experience_years":"3"}'
      button_type: vertical
  utter_ask_skills:
    - text: "Какие навыки и инструменты вы чаще всего используете?"
    - text: "Что вы считаете своими сильными сторонами в работе?"
    - text: "С чем вы уверенно справляетесь: инструменты, процессы, аналитика, разработка, управление?"
    - text: "Теперь про навыки: какие инструменты, технологии или процессы у вас самые сильные?"
    - text: "Окей, давайте по стеку и сильным сторонам. Что точно стоит отметить?"
  utter_ask_project_types:
    - text: "Расскажите про один-два проекта, которые лучше всего показывают ваш опыт."
    - text: "Какой проект из последних вы бы выделили и что именно вы в нем делали?"
    - text: "С какими задачами или проектами вы работали ближе всего к выбранной роли?"
    - text: "Теперь про практику: какой проект лучше всего показывает ваш уровень?"
    - text: "Давайте к проектам. Опишите один пример: задача, ваш вклад и результат."
  utter_ask_project_role:
    - text: "Какая была ваша зона ответственности в этих проектах?"
      buttons:
        - title: "Управление"
          payload: '/provide_projects{"project_role":"manager"}'
        - title: "Аналитика"
          payload: '/provide_projects{"project_role":"analyst"}'
        - title: "Разработка"
          payload: '/provide_projects{"project_role":"developer"}'
        - title: "Лидировал"
          payload: '/provide_projects{"project_role":"lead"}'
        - title: "Другое"
