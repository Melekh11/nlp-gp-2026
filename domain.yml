          payload: '/provide_english{"english_level":"b1"}'
        - title: "B2"
          payload: '/provide_english{"english_level":"b2"}'
        - title: "C1"
          payload: '/provide_english{"english_level":"c1"}'
  utter_ask_work_format:
    - text: "Какой формат работы вам подходит: офис, удаленно, гибрид или любой вариант?"
      buttons:
        - title: "Офис"
          payload: '/provide_work_format{"work_format":"office"}'
        - title: "Удаленно"
          payload: '/provide_work_format{"work_format":"remote"}'
        - title: "Гибрид"
