          payload: '/provide_work_format{"work_format":"office"}'
        - title: "Удаленно"
          payload: '/provide_work_format{"work_format":"remote"}'
        - title: "Гибрид"
          payload: '/provide_work_format{"work_format":"hybrid"}'
        - title: "Без разницы"
          payload: '/provide_work_format{"work_format":"any"}'
      button_type: vertical
  utter_ask_salary_expectation_min:
    - text: "Какую зарплату вы рассматриваете?"
      buttons:
        - title: "50к-100к"
          payload: '/provide_salary{"salary_amount":"50к-100к"}'
        - title: "100к-200к"
          payload: '/provide_salary{"salary_amount":"100к-200к"}'
        - title: "200к-500к"
          payload: '/provide_salary{"salary_amount":"200к-500к"}'
      button_type: vertical
    - text: "Какая зарплатная вилка была бы для вас комфортной?"
