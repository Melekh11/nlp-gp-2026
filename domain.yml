    - text: "Что именно было на вашей стороне: разработка, анализ, управление, лидерство?"
      buttons:
        - title: "Управление"
          payload: '/provide_projects{"project_role":"manager"}'
        - title: "Аналитика"
          payload: '/provide_projects{"project_role":"analyst"}'
        - title: "Разработка"
          payload: '/provide_projects{"project_role":"developer"}'
        - title: "Лидировал"
          payload: '/provide_projects{"project_role":"lead"}'
        - title: "Другое"
          payload: '/provide_projects{"project_role":"unknown"}'
      button_type: vertical
    - text: "Какую роль вы занимали в команде?"
      buttons:
