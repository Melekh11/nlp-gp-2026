version: "3.1"

rules:
- rule: Greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: Start interview
  steps:
    - intent: start_interview
    - action: utter_start_interview
    - action: interview_form
    - active_loop: interview_form

- rule: Start-like message during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: start_interview
    - action: action_contextual_fallback
    - action: interview_form
    - active_loop: interview_form

- rule: Affirm starts interview
  steps:
    - intent: affirm
    - action: utter_start_interview
    - action: interview_form
    - active_loop: interview_form

- rule: Submit interview form
  condition:
    - active_loop: interview_form
  steps:
    - action: interview_form
    - active_loop: null
    - action: action_rank_candidate

- rule: Stop interview
  steps:
    - intent: stop_interview
    - action: utter_stop_interview
    - action: action_deactivate_loop
    - active_loop: null

- rule: Goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Fallback
  steps:
    - intent: nlu_fallback
    - action: utter_default

- rule: Fallback during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: nlu_fallback
    - action: action_contextual_fallback
    - action: interview_form
    - active_loop: interview_form

- rule: Out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Out of scope during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope
    - action: interview_form
    - active_loop: interview_form

- rule: Repeat question
  steps:
    - intent: repeat_question
    - action: action_repeat_question

- rule: Skip question during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: skip_question
    - action: action_skip_question
    - action: interview_form
    - active_loop: interview_form

- rule: Handle experience answer during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: provide_exp
    - action: interview_form
    - active_loop: interview_form

- rule: Handle skills answer during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: provide_skills
    - action: interview_form
    - active_loop: interview_form

- rule: Handle projects answer during form
  condition:
    - active_loop: interview_form
  steps:
    - intent: provide_projects
    - action: interview_form
    - active_loop: interview_form

- rule: Handle salary answer during form
